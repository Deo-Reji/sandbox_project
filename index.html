<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataLab Sandbox</title>
  <link rel="stylesheet" href="vendor/codemirror/codemirror.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230528CC'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23FF1FA0'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <nav class="tabs" id="tabs"></nav>
      <div class="brand">DataLab Sandbox <span class="brand-sub">fictional Saint Louis University dataset</span></div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="main">
        <section class="view view-work" id="view-work">
          <div class="panel panel-code">
            <div class="panel-head">
              <span class="panel-title" id="panel-title">Code Terminal</span>
              <div class="toolbar">
                <span class="mode-switch" id="mode-switch" hidden>
                  <button class="mode-btn active" data-mode="sql">SQL</button><button class="mode-btn" data-mode="pandas">pandas</button>
                </span>
                <button class="btn" id="btn-run" title="Run without grading (Ctrl/Cmd+Enter)">▶ Run</button>
                <button class="btn btn-ghost" id="btn-reset" title="Reset to the starter code">Reset</button>
                <button class="btn btn-ghost" id="btn-hint">Hint</button>
                <button class="btn btn-ghost" id="btn-solution" disabled title="Enabled after your first Check">Show solution</button>
                <button class="btn btn-ghost" id="btn-schema" title="Tables, columns, keys and a 10-row preview">Schema ▾</button>
                <button class="btn btn-ghost" id="btn-resetdb" hidden title="Reload the database from the original file">Reset DB</button>
              </div>
            </div>
            <div class="editor-host" id="editor"></div>
            <div class="grid-host" id="grid" hidden></div>
            <div class="mc-host" id="mc" hidden></div>
            <div class="hint-box" id="hint-box" hidden></div>
          </div>

          <div class="panel panel-output">
            <div class="panel-head">
              <span class="panel-title">Output terminal</span>
              <span class="status" id="status"></span>
              <button class="btn btn-small btn-ghost" id="btn-cancel" hidden>Cancel</button>
            </div>
            <div class="output-body" id="output"></div>
            <div class="verdict" id="verdict" hidden></div>
            <div class="output-foot"><button class="btn-check" id="btn-check">Check Answer</button></div>
          </div>

          <div class="panel panel-prompt">
            <div class="prompt-head"><span class="prompt-label">Prompt:</span> <span class="problem-title" id="problem-title"></span></div>
            <div class="prompt-body" id="prompt"></div>
          </div>
        </section>

        <section class="view view-tutorial panel" id="view-tutorial" hidden></section>
      </main>
    </div>

    <aside class="drawer" id="drawer" hidden>
      <div class="drawer-head"><strong>Schema / Data browser</strong><button class="btn btn-small btn-ghost" id="drawer-close">Close ✕</button></div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <footer class="footer">All people, places and numbers in this dataset are fictional. Built for practice; nothing leaves your browser.</footer>
  </div>

  <script src="vendor/codemirror/codemirror.js"></script>
  <script src="vendor/codemirror/mode/sql.js"></script>
  <script src="vendor/codemirror/mode/python.js"></script>
  <script src="vendor/hyperformula/hyperformula.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
